[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast_lab"
version = "0.2.0"
description = "Multi-Sport AI Forecasting Lab: an educational sports forecasting simulator (no betting)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Added in later milestones; listed here so you can see what's coming.
later = ["scikit-learn>=1.4", "matplotlib>=3.8", "duckdb>=1.0", "streamlit>=1.35"]

[project.scripts]
forecast-lab = "forecast_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
